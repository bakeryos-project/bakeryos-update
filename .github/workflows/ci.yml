
name: CI

on:
  push:
    branches:
      - main

jobs:
  call-build-workflow:
    if: >-
      !startsWith(github.event.head_commit.message, 'chore:')
      && !startsWith(github.event.head_commit.message, 'chore(')
    uses: bakeryos-project/ci/.github/workflows/build-package.yml@main
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
